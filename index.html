<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TyanePon 勝率ダッシュボード</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--txt:#e7e9ee;--mut:#9aa0ac;--grn:#3ecf8e;--red:#ff6b6b;--neu:#c9cdd6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:18px;font-weight:600;margin:4px 0 2px}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.pc .nm{font-size:13px;color:var(--mut)}
.pc .big{font-size:30px;font-weight:700;line-height:1.1;margin:2px 0}
.pc .wl{font-size:12px;color:var(--mut)}
.pc .m30{font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 5px;text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--mut);font-weight:500;font-size:12px;border-bottom:1px solid var(--line)}
tbody tr{border-bottom:1px solid var(--line)}tbody tr:last-child{border-bottom:none}
.win{color:var(--grn)}.loss{color:var(--red)}.neu{color:var(--neu)}
.pct{font-weight:600}.small{font-size:12px;color:var(--mut)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select{background:#11141a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;flex:1;min-width:108px}
button{background:var(--grn);color:#06281c;border:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;width:100%;margin-bottom:14px}
.agg{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.stat{flex:1;min-width:70px;background:#11141a;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat .n{font-size:19px;font-weight:600}.stat .l{font-size:11px;color:var(--mut)}
.foot{color:var(--mut);font-size:11px;margin-top:10px;line-height:1.6}
.h2{font-size:13px;color:var(--mut);margin:0 0 8px}
</style></head><body><div class="wrap">
<h1>TyanePon 勝率ダッシュボード</h1>
<div class="sub" id="meta"></div>

<div class="h2">直近成績（大きな数字=直近7日 / 下=直近30日）</div>
<div class="grid" id="cards"></div>
<button onclick="copySummary()">この成績をコピー（グループに貼り付け用）</button>

<div class="card">
<div class="small" style="margin-bottom:6px">期間別まとめ（3分判定 / 分岐 <span id="be"></span>%）</div>
<table id="summary"></table>
</div>

<div class="card">
<div class="small" style="margin-bottom:8px">条件・検索</div>
<div class="controls">
<select id="fpair"></select>
<input type="date" id="ffrom"><input type="date" id="fto">
</div>
<div class="controls">
<input type="number" id="amt" value="1000" min="0" step="100" inputmode="numeric">
<input type="number" id="pay" value="1.90" min="1" step="0.05" inputmode="decimal">
</div>
<div class="small" style="margin:-4px 0 8px">左=1回の金額(円) / 右=ペイアウト倍率(例 1.90=利益90%)</div>
<div class="agg" id="agg"></div>
<canvas id="chart" style="width:100%;height:170px;display:block"></canvas>
<table id="daily"></table>
</div>
<div class="foot" id="foot"></div>
</div>
<script src="data.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body></html>
